name: Release

# Un tag vX.Y.Z publie fr.beltaria:commons:X.Y.Z dans la branche `maven` de ce depot, servie par
# raw.githubusercontent (voir README, "Utiliser la bibliotheque"). Une version publiee n'est jamais reecrite.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Build et tests avec un jeton en lecture seule, absent du checkout : le code que Gradle execute
  # (script de build, dependances) ne peut pas ecrire dans le depot.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Resolve the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build, test and stage the Maven files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew build publishToMavenLocal -PpluginVersion="$VERSION" --console=plain
          mkdir -p staged
          cp "$HOME/.m2/repository/fr/beltaria/commons/$VERSION"/* staged/
          ls -l staged

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven
          path: staged/
          if-no-files-found: error

  # Seul job qui ecrit, et il n'execute aucun code du projet : il range les fichiers construits plus haut.
  # Deux tags proches ne poussent jamais en meme temps sur `maven`. La branche `maven` existe depuis la creation du
  # depot (branche orpheline, README). Si la release GitHub echoue apres le push, la creer a la main : rejouer ce
  # job s'arrete sur "deja publiee", volontairement.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maven-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: maven
          path: maven-repo

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maven
          path: staged

      - name: Publish to the maven branch
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          dst="maven-repo/fr/beltaria/commons/$VERSION"
          if [ -d "$dst" ]; then
            echo "::error::fr.beltaria:commons:$VERSION est deja publiee. Une version publiee n'est jamais reecrite : nouveau tag."
            exit 1
          fi
          mkdir -p "$dst"
          # maven-local-metadata.xml : propre a ~/.m2, inutile a un depot distant. Les consommateurs epinglent la version.
          find staged -maxdepth 1 -type f ! -name 'maven-metadata*' -exec cp {} "$dst"/ \;
          ( cd "$dst" && for f in *.jar *.pom *.module; do sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"; sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done )
          ls -l "$dst"
          cd maven-repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Publish fr.beltaria:commons:$VERSION from ${GITHUB_SHA}"
          git push

      # Apres le push : si cette etape echoue, la version est deja publiee et rejouer le job s'arrete sur
      # "deja publiee". Creer alors la release GitHub a la main (gh release create <tag>).
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: staged/*.jar
          generate_release_notes: true
